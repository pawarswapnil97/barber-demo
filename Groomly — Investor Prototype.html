function modal(title,body,actions=''){document.getElementById('modal').innerHTML=`<h2>${title}</h2><p>${body}</p>${actions||'<div class="modal-actions"><button class="outline" onclick="closeModal()">Close</button></div>'}`;document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function setRole(role){state.role=role;state.screen=role==='customer'?'home':role==='partner'?'overview':'overview';state.step=0;document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));render()}
function go(screen){state.screen=screen;render();window.scrollTo({top:0,behavior:'smooth'})}
function actionButton(label,fn,cls='primary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function pageHead(kicker,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,value,foot,icon){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function panelHead(title,desc='',right=''){return `<div class="panel-head"><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${right}</div>`}
function bookingItem(b){return `<div class="booking"><div class="avatar">${b.name.includes('Beard')?'✦':'✂'}</div><div class="booking-info"><strong>${b.name}</strong><span>${b.salon} · ${b.person}</span><span style="display:block;margin-top:4px">${b.date} · ${b.time}</span></div><div style="text-align:right"><div class="time">₹${b.price}</div><span class="badge ${b.status==='Confirmed'?'success':b.status==='Completed'?'neutral':'pending'}" style="margin-top:7px">${b.status}</span></div></div>`}
function salonCard(s){return `<article class="card salon-card" onclick="openSalon('${s.name}')"><div class="salon-art" style="background:${s.name.includes('Olive')?'#a7a68a':s.name.includes('Noir')?'#6b6258':s.name.includes('Mane')?'#8f7964':'#b8a185'}"><div class="scene">${s.art}</div><span>${s.tag}</span></div><div class="salon-content"><h3>${s.name}</h3><div class="salon-meta"><span>★ ${s.rating} (${s.reviews})</span><span>· ${s.distance}</span></div><div class="salon-meta" style="margin-top:7px">${s.area}</div><div class="price-line"><span>From <strong>₹${s.price}</strong></span><span style="color:#23865b;font-weight:750">Today · ${s.next}</span></div></div></article>`}
function navForRole(){return state.role==='customer'?customerNav:state.role==='partner'?partnerNav:adminNav}
function renderNav(){const nav=navForRole();document.getElementById('sidebar').innerHTML=`<div><div class="side-label">${state.role==='customer'?'Discover & book':state.role==='partner'?'Business workspace':'Platform control'}</div><div class="nav-list">${nav.map(n=>`<button class="nav-item ${state.screen===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}</div></div><div class="side-bottom"><strong>✦ ${state.role==='customer'?'Groomly Select':state.role==='partner'?'Partner success':'Platform health'}</strong><p>${state.role==='customer'?'A little self-care, on your schedule. Discover your next favorite.':state.role==='partner'?'Your business, beautifully organized. Keep your chair full.':'One view of the entire Groomly marketplace.'}</p><button class="small-btn" onclick="toast('This is a demonstration environment')">Explore demo ↗</button></div>`;
 document.getElementById('mobileNav').innerHTML=nav.slice(0,5).map(n=>`<button class="${state.screen===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}
function render(){renderNav();let html='';if(state.role==='customer')html=customerScreen();else if(state.role==='partner')html=partnerScreen();else html=adminScreen();document.getElementById('main').innerHTML=`<div class="screen">${html}</div>`}
function customerScreen(){switch(state.screen){case'home':return customerHome();case'explore':return explore();case'search':return searchScreen();case'salon':return salonDetail();case'booking':return bookingFlow();case'bookings':return customerBookings();case'favorites':return favorites();case'profile':return customerProfile();case'notifications':return notifications();case'help':return helpScreen();case'paymentHistory':return paymentHistory();case'login':return authScreen();case'location':return locationScreen();default:return customerHome()}}
function customerHome(){return `${pageHead('SATURDAY, OCTOBER 18','Good morning, Sam.','Ready for a little you-time? Find your next great look.',actionButton('＋ Book an appointment',"startBooking()"))}<div class="searchbar"><div class="searchbox"><span>⌕</span><input placeholder="Services, salons, or professionals" value="${state.query}" oninput="state.query=this.value" onkeydown="if(event.key==='Enter')go('search')"/><span>⌖</span></div><button class="outline" onclick="go('search')">Search</button></div><div class="notice" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span>⌖ &nbsp; <strong>Koregaon Park, Pune</strong><br><span style="font-size:10px">Showing the best near you</span></span><button class="link-btn" onclick="go('location')">Change ↗</button></div><div class="panel" style="margin-bottom:24px;background:#211f1b;color:white;border:0;position:relative;overflow:hidden"><div style="position:absolute;right:8%;top:-20px;font-size:130px;opacity:.13">✂</div><div class="eyebrow" style="color:var(--gold)">YOUR TIME, WELL SPENT</div><h2 style="font-size:27px;letter-spacing:-1px;max-width:370px;margin:0 0 9px">Good grooming.<br>Great confidence.</h2><p style="font-size:12px;line-height:1.6;color:#c5beb2;max-width:330px;margin:0 0 19px">Book trusted local professionals in a few taps. Your next best look is closer than you think.</p>${actionButton('Find your chair <span class="gold">→</span>',"go('explore')")}</div><div class="panel-head"><div><h2>Explore by service</h2><p>Your look, your way.</p></div><button class="link-btn" onclick="go('explore')">View all ↗</button></div><div class="grid category-grid">${categories.slice(0,5).map(c=>`<div class="category" onclick="state.query='${c[1]}';go('search')"><div class="cat-icon">${c[0]}</div><strong>${c[1]}</strong><small>${c[2]}</small></div>`).join('')}</div><div class="panel-head"><div><h2>Standout salons nearby</h2><p>Chosen for you, loved by your neighborhood.</p></div><button class="link-btn" onclick="go('explore')">See all ↗</button></div><div class="grid salon-grid">${salons.slice(0,3).map(salonCard).join('')}</div><div class="panel" style="margin-top:24px">${panelHead('Your next appointment','Everything you need, right here.',actionButton('View bookings →',"go('bookings')",'outline'))}${state.bookings.length?bookingItem(state.bookings[0]):'<div class="empty"><p>No upcoming appointments yet.</p></div>'}</div>`}
function explore(){return `${pageHead('FIND YOUR PEOPLE','Explore salons','Discover top-rated barbers, stylists, and beauty experts near you.',actionButton('⌖ Map view',"toast('Map preview selected — location pins are demo data')",'outline'))}<div class="searchbar"><div class="searchbox"><span>⌕</span><input placeholder="Try ‘fade haircut’ or ‘hair spa’" value="${state.query}" oninput="state.query=this.value" onkeydown="if(event.key==='Enter')go('search')"/></div>${actionButton('Search',"go('search')")}</div><div class="chips">${['All services','Haircut','Beard & shave','Hair spa','Hair color','Facial'].map((x,i)=>`<button class="chip ${state.filter===x||i===0&&state.filter==='All'?'active':''}" onclick="state.filter='${x==='All services'?'All':x}';render()">${x}</button>`).join('')}<button class="chip" onclick="openFilters()">☷ Filters</button></div><div class="grid category-grid">${categories.map(c=>`<div class="category ${state.query===c[1]?'selected':''}" onclick="state.query='${c[1]}';state.filter='${c[1]}';render()"><div class="cat-icon">${c[0]}</div><strong>${c[1]}</strong><small>${c[2]}</small></div>`).join('')}</div>${panelHead('Salons around you',`${salons.length} curated places · Sorted by recommended`, '<button class="link-btn" onclick="openFilters()">Sort & filter ☷</button>')}<div class="grid salon-grid">${salons.filter(s=>state.filter==='All'||s.services.some(x=>x.toLowerCase().includes(state.filter.toLowerCase().split(' ')[0]))||state.filter==='Haircut'&&s.services.some(x=>x.includes('Haircut'))).map(salonCard).join('')||'<div class="panel empty"><div class="empty-icon">⌕</div><h3>No exact matches</h3><p>Try a different service or clear your filters to explore all nearby salons.</p><button class="outline" onclick="state.filter=\'All\';render()">Clear filters</button></div>'}</div>`}
function searchScreen(){let q=state.query.toLowerCase();let matches=salons.filter(s=>(s.name+' '+s.area+' '+s.services.join(' ')).toLowerCase().includes(q));return `${pageHead('SEARCH','Find your next favorite','Search services, salons, or the professionals behind the chair.')}<div class="searchbar"><div class="searchbox"><span>⌕</span><input autofocus placeholder="Search salons or services" value="${state.query}" oninput="state.query=this.value;renderSearchResults()" onkeydown="if(event.key==='Enter')renderSearchResults()"/><button class="link-btn" onclick="state.query='';go('search')">×</button></div>${actionButton('Search',"renderSearchResults()")}</div><div id="searchResults">${searchResultsHTML(matches,q)}</div><div class="panel" style="margin-top:18px">${panelHead('Popular searches','A little inspiration to get you started')}<div class="chips">${['Skin fade','Beard trim','Hair spa','Hair coloring','Blow dry'].map(x=>`<button class="chip" onclick="state.query='${x}';renderSearchResults();document.querySelector('.searchbox input').value='${x}'">⌕ ${x}</button>`).join('')}</div></div>`}
function searchResultsHTML(matches,q){return `${panelHead(q?'Search results':'Recent & suggested',q?`${matches.length} matching salons and services`:'Popular in Koregaon Park')}<div class="grid salon-grid">${(q?matches:salons.slice(0,3)).map(salonCard).join('')||'<div class="panel empty"><div class="empty-icon">⌕</div><h3>Nothing found just yet</h3><p>Try “haircut”, “beard”, or a salon name. We’ll help you find the right fit.</p><button class="outline" onclick="state.query=\'\';renderSearchResults()">Clear search</button></div>'}</div>`}
function renderSearchResults(){let el=document.getElementById('searchResults');if(el)el.innerHTML=searchResultsHTML(salons.filter(s=>(s.name+' '+s.area+' '+s.services.join(' ')).toLowerCase().includes(state.query.toLowerCase())),state.query.toLowerCase());}
function openFilters(){modal('Refine your search','Find a salon that fits your schedule and style.',`<div class="form-field"><label>Minimum rating</label><select id="fRating"><option>Any rating</option><option>4.5+ stars</option><option>4.8+ stars</option></select></div><div class="form-field"><label>Price range</label><select id="fPrice"><option>Any price</option><option>Under ₹300</option><option>₹300–₹600</option><option>₹600+</option></select></div><div class="form-field"><label>Availability</label><select id="fTime"><option>Any time</option><option>Available today</option><option>Available this week</option></select></div><div class="modal-actions"><button class="outline" onclick="closeModal()">Cancel</button><button class="primary" onclick="closeModal();toast('Filters applied to your salon discovery')">Show results ↗</button></div>`)}
function openSalon(name){state.activeSalon=name;state.screen='salon';render()}
function activeSalon(){return salons.find(s=>s.name===state.activeSalon)||salons[0]}
function salonDetail(){let s=activeSalon();return `${actionButton('← Back to explore',"go('explore')",'outline')}<div class="flow-card" style="margin-top:16px"><div class="flow-cover" style="height:210px;background:linear-gradient(135deg,#b8a185,#473c31)"><span style="position:relative;z-index:1;font-size:90px">${s.art}</span><div class="flow-cover-label">${s.tag} · PUNE</div></div><div class="flow-body"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><div class="eyebrow">PREMIUM GROOMING</div><h2>${s.name}</h2><p class="sub">★ ${s.rating} (${s.reviews} reviews) · ${s.distance} away<br>⌖ ${s.area}<br><span style="color:#23865b">● Open today · 9:00 AM – 9:00 PM</span></p></div><button class="outline" onclick="toggleFavorite('${s.name}')">${state.favorites.includes(s.name)?'♥ Saved':'♡ Save'}</button></div><div class="chips"><span class="chip">✓ Verified professionals</span><span class="chip">✦ Premium products</span><span class="chip">⌖ Easy parking</span></div><div class="tabs"><button class="active" onclick="salonTab('Services',this)">Services</button><button onclick="salonTab('Team',this)">Our team</button><button onclick="salonTab('Reviews',this)">Reviews</button><button onclick="salonTab('Info',this)">Info</button></div><div id="salonTabContent" style="margin-top:20px">${salonServicesHTML(s)}</div><div class="flow-footer"><div><small style="color:#898277">Services from</small><div style="font-size:18px;font-weight:800">₹${s.price}</div></div>${actionButton('Book this salon →',"startBooking()")}</div></div></div>`}
function salonServicesHTML(s){return s.services.map((x,i)=>`<div class="service-row"><div class="avatar">${['✂','🧔','🫧','💆'][i%4]}</div><div class="service-info"><strong>${x}</strong><small>${[30,20,15,25][i%4]} min · ${i===0?'Most popular':'Expert service'}</small></div><div class="service-price">₹${[s.price,250,150,200][i%4]}</div></div>`).join('')}
function salonTab(tab,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===el));let s=activeSalon(),content=document.getElementById('salonTabContent');if(!content)return;if(tab==='Services')content.innerHTML=salonServicesHTML(s);else if(tab==='Team')content.innerHTML=[['AM','Arjun Mehta','Master Barber · 8 years','Fades, classic cuts'],['KS','Kabir Shah','Senior Stylist · 6 years','Texture, beard design'],['RV','Riya Verma','Style Director · 9 years','Color, hair spa']].map(x=>`<div class="profile-row"><div class="avatar">${x[0]}</div><div class="details"><strong>${x[1]}</strong><p>${x[2]} · ${x[3]}</p></div><span class="badge neutral">★ 4.9</span></div>`).join('');else if(tab==='Reviews')content.innerHTML=`<div class="notice green">★ 4.9 out of 5 · Based on ${s.reviews} verified visits</div>${[['“Excellent attention to detail. Best fade I’ve had in Pune.”','Rohan P. · 2 days ago'],['“Really welcoming team and an easy booking experience.”','Aman K. · 1 week ago'],['“On time, clean space, and great service.”','Dev S. · 2 weeks ago']].map(x=>`<div class="service-row"><div class="service-info"><strong>★★★★★</strong><small>${x[0]}<br><br>${x[1]}</small></div></div>`).join('')}`;else content.innerHTML=`<div class="service-row"><div class="service-info"><strong>Opening hours</strong><small>Mon–Sun · 9:00 AM – 9:00 PM</small></div></div><div class="service-row"><div class="service-info"><strong>Address</strong><small>${s.area}, Pune, Maharashtra</small></div></div><div class="service-row"><div class="service-info"><strong>Contact</strong><small>+91 98765 43210 · Demo contact</small></div></div><button class="outline" onclick="toast('Directions are simulated in this investor demo')">↗ Get directions</button>`}
function toggleFavorite(name){if(state.favorites.includes(name))state.favorites=state.favorites.filter(x=>x!==name);else state.favorites.push(name);toast(state.favorites.includes(name)?'Added to your favorites':'Removed from favorites');render()}
function startBooking(){state.step=0;state.selectedService=[activeSalon().services[0]||'Signature Haircut'];state.stylist='Arjun Mehta';state.date='Sat, 18 Oct';state.time='11:30 AM';state.bookingType='In-salon';state.payment='UPI';state.discount=0;state.coupon='';go('booking')}
function bookingFlow(){let steps=['Services','Professional','Time','Details','Payment'];let s=activeSalon();let price=servicePrice();let total=Math.max(0,price-state.discount);let step=state.step;let body='';if(step===0)body=`<h2>Choose your services</h2><p class="sub">Select one or more services. Clear pricing, no surprises.</p>${s.services.map((x,i)=>`<div class="service-row ${state.selectedService.includes(x)?'chosen':''}" onclick="toggleService('${x}')"><div class="avatar">${['✂','🧔','🫧','💆'][i%4]}</div><div class="service-info"><strong>${x}</strong><small>${[30,20,15,25][i%4]} min · Professional service</small></div><div class="service-price">₹${[s.price,250,150,200][i%4]}</div><div class="check">${state.selectedService.includes(x)?'✓':''}</div></div>`).join('')}`;
if(step===1)body=`<h2>Who would you like?</h2><p class="sub">Pick your preferred professional or let us find the best available match.</p><div class="option-row ${state.stylist==='Any Available Professional'?'chosen':''}" onclick="state.stylist='Any Available Professional';render()"><div class="avatar">✦</div><div class="option-info"><strong>Any Available Professional</strong><small>First available · Fastest appointment</small></div><div class="check">${state.stylist==='Any Available Professional'?'✓':''}</div></div>${[['AM','Arjun Mehta','Master Barber · 8 years','4.9'],['KS','Kabir Shah','Senior Stylist · 6 years','4.8'],['RV','Riya Verma','Style Director · 9 years','4.9']].map(x=>`<div class="option-row ${state.stylist===x[1]?'chosen':''}" onclick="state.stylist='${x[1]}';render()"><div class="avatar">${x[0]}</div><div class="option-info"><strong>${x[1]}</strong><small>${x[2]} · ★ ${x[3]}</small></div><div class="check">${state.stylist===x[1]?'✓':''}</div></div>`).join('')}`;
if(step===2)body=`<h2>Pick your perfect time</h2><p class="sub">Available slots update as appointments are booked.</p><div class="date-strip">${[['Fri','17'],['Sat','18'],['Sun','19'],['Mon','20'],['Tue','21']].map((x,i)=>`<button class="date-option ${state.date===['Fri, 17 Oct','Sat, 18 Oct','Sun, 19 Oct','Mon, 20 Oct','Tue, 21 Oct'][i]?'chosen':''}" onclick="state.date='${x[0]}, ${x[1]} Oct';render()"><small>${x[0]}</small><strong>${x[1]}</strong><small>Oct</small></button>`).join('')}</div><div style="font-size:11px;font-weight:800;margin-bottom:10px">Morning</div><div class="slot-grid">${['9:00 AM','9:30 AM','10:00 AM','10:30 AM'].map(x=>`<button class="slot ${state.time===x?'chosen':''}" onclick="state.time='${x}';render()">${x}</button>`).join('')}</div><div style="font-size:11px;font-weight:800;margin-bottom:10px">Afternoon</div><div class="slot-grid">${['11:00 AM','11:30 AM','12:15 PM','1:00 PM','2:00 PM','3:30 PM','4:00 PM','5:00 PM'].map((x,i)=>`<button class="slot ${i===5?'unavailable':''} ${state.time===x?'chosen':''}" ${i===5?'disabled':''} onclick="state.time='${x}';render()">${x}</button>`).join('')}</div><div class="flow-note">Times are illustrative demo inventory; a production release would sync live availability with each salon.</div>`;
if(step===3)body=`<h2>Review your appointment</h2><p class="sub">One last look before payment. You can change anything here.</p><div class="service-row"><div class="avatar">${s.art}</div><div class="service-info"><strong>${s.name}</strong><small>${s.area}</small></div></div><div class="summary-box"><div class="sum-line"><span>Services</span><strong>${state.selectedService.join(', ')}</strong></div><div class="sum-line"><span>Professional</span><strong>${state.stylist}</strong></div><div class="sum-line"><span>Date & time</span><strong>${state.date} · ${state.time}</strong></div><div class="sum-line"><span>Booking type</span><strong>${state.bookingType}</strong></div><div class="sum-line"><span>Duration</span><strong>${state.selectedService.length*30} min</strong></div><div class="sum-line"><span>Subtotal</span><strong>₹${price}</strong></div>${state.discount?`<div class="sum-line"><span>Promo discount</span><strong style="color:#23865b">−₹${state.discount}</strong></div>`:''}<div class="sum-line total"><span>Total to pay</span><strong>₹${total}</strong></div></div><div class="form-field"><label>Appointment type</label><div class="chips"><button class="chip ${state.bookingType==='In-salon'?'active':''}" onclick="state.bookingType='In-salon';render()">In-salon</button><button class="chip ${state.bookingType==='Home service'?'active':''}" onclick="state.bookingType='Home service';render()">Home service +₹150</button></div></div><div class="form-field"><label>Promo code</label><div style="display:flex;gap:8px"><input id="couponInput" value="${state.coupon}" placeholder="Enter code (try GROOM10)" style="flex:1;min-width:0;border:1px solid #e5dfd5;border-radius:10px;padding:12px;font-size:12px"><button class="outline" onclick="applyCoupon()">Apply</button></div>${state.discount?'<div class="helper" style="color:#23865b">GROOM10 applied — ₹45 saved.</div>':'<div class="helper">Try GROOM10 for a demo discount.</div>'}</div>`;
if(step===4)body=`<h2>Choose how to pay</h2><p class="sub">Secure checkout. Your payment details are never stored in this demo.</p><div class="summary-box"><div class="sum-line"><span>${state.selectedService.join(', ')}</span><strong>₹${price}</strong></div><div class="sum-line"><span>Discount</span><strong>−₹${state.discount}</strong></div><div class="sum-line total"><span>Payable now</span><strong>₹${total+(state.bookingType==='Home service'?150:0)}</strong></div></div>${[['UPI','◈','Google Pay, PhonePe, Paytm'],['Card','▤','Credit or debit card'],['Net banking','▣','All major Indian banks'],['Pay at salon','₹','Cash or supported payment at venue']].map(x=>`<div class="pay-option ${state.payment===x[0]?'chosen':''}" onclick="state.payment='${x[0]}';render()"><div class="avatar">${x[1]}</div><div class="option-info"><strong>${x[0]}</strong><small>${x[2]}</small></div><div class="check">${state.payment===x[0]?'✓':''}</div></div>`).join('')}<div class="flow-note">Investor demo only: selecting payment simulates checkout; no money is collected and no real booking is created.</div>`;
return `<div style="max-width:820px;margin:0 auto">${actionButton('← Back',"go('salon')",'outline')}<div class="flow-card" style="margin-top:15px"><div class="flow-cover"><span style="position:relative;z-index:1">${s.art}</span><div class="flow-cover-label">BOOK WITH GROOMLY · ${s.name}</div></div><div class="flow-body"><div class="steps">${steps.map((x,i)=>`<div class="step ${i<=step?'done':''}" title="${x}"></div>`).join('')}</div><div class="eyebrow">STEP ${step+1} OF 5 · ${steps[step]}</div>${body}<div class="flow-footer"><button class="outline" ${step===0?'disabled':''} onclick="state.step=Math.max(0,state.step-1);render()">Back</button><button class="primary" onclick="${step===4?'completeBooking()':`nextBookingStep()`}">${step===4?'Confirm & simulate payment · ₹'+(total+(state.bookingType==='Home service'?150:0)):'Continue →'}</button></div></div></div><p class="flow-note" style="text-align:center">Secure, simple, and on your schedule. · Demo prototype</p></div>`}
function servicePrice(){let s=activeSalon();let total=0;state.selectedService.forEach(x=>{let i=s.services.indexOf(x);total+=i===0?s.price:i===1?250:i===2?150:200});return total||s.price}
function toggleService(x){if(state.selectedService.includes(x)){if(state.selectedService.length>1)state.selectedService=state.selectedService.filter(y=>y!==x)}else state.selectedService.push(x);render()}
function nextBookingStep(){if(state.step===0&&!state.selectedService.length){toast('Please choose at least one service');return}state.step=Math.min(4,state.step+1);render()}
function applyCoupon(){let v=(document.getElementById('couponInput')?.value||'').trim().toUpperCase();if(v==='GROOM10'){state.coupon=v;state.discount=45;toast('GROOM10 applied — ₹45 saved')}else{state.coupon=v;state.discount=0;toast('That code is not valid in this demo')}render()}
function completeBooking(){if(state.payment==='Card'){modal('Card checkout preview','A production payment gateway would open here. For this demo, continue to simulate a successful payment.',`<div class="modal-actions"><button class="outline" onclick="closeModal()">Go back</button><button class="primary" onclick="closeModal();finishBooking()">Simulate success</button></div>`);return}finishBooking()}
function finishBooking(){let id='GR-'+Math.floor(20000+Math.random()*79999);let b={id,name:state.selectedService.join(' + '),salon:activeSalon().name,person:state.stylist,date:state.date,time:state.time,price:Math.max(0,servicePrice()-state.discount)+(state.bookingType==='Home service'?150:0),status:'Confirmed'};state.bookings.unshift(b);state.latestBooking=b;state.screen='bookingSuccess';render()}
function customerBookings(){let list=state.tab==='Upcoming'?state.bookings.filter(b=>b.status==='Confirmed'):state.tab==='Past'?state.bookings.filter(b=>b.status==='Completed'):state.bookings.filter(b=>b.status==='Cancelled');return `${pageHead('YOUR GROOMLY','My appointments','Your plans, all in one place.',actionButton('＋ New booking',"startBooking()"))}<div class="panel"><div class="panel-head"><div><h2>Appointments</h2><p>Manage, reschedule, or revisit your bookings.</p></div><div class="tabs">${['Upcoming','Past','Cancelled'].map(x=>`<button class="${state.tab===x?'active':''}" onclick="state.tab='${x}';render()">${x}</button>`).join('')}</div></div>${list.length?`<div class="booking-list">${list.map(b=>`${bookingItem(b)}<div class="btn-row" style="justify-content:flex-end;margin-top:-5px;margin-bottom:10px">${b.status==='Confirmed'?`<button class="outline" onclick="reschedule('${b.id}')">↻ Reschedule</button><button class="outline" onclick="cancelBooking('${b.id}')">Cancel</button>`:b.status==='Completed'?`<button class="outline" onclick="rateBooking('${b.id}')">★ Rate visit</button><button class="primary" onclick="startBooking()">Rebook →</button>`:''}<button class="link-btn" onclick="bookingDetails('${b.id}')">Details ↗</button></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">${state.tab==='Upcoming'?'▣':'✦'}</div><h3>${state.tab==='Upcoming'?'Your calendar is looking clear':'Nothing here just yet'}</h3><p>${state.tab==='Upcoming'?'A little self-care goes a long way. Book your next appointment in a few taps.':'Your appointment history will appear here.'}</p><button class="primary" onclick="${state.tab==='Upcoming'?'startBooking()':"state.tab='Upcoming';render()"}">${state.tab==='Upcoming'?'Find a salon':'View upcoming'}</button></div>`}</div>`}
function bookingDetails(id){let b=state.bookings.find(x=>x.id===id);if(!b)return;modal('Appointment details',`${b.name}<br>${b.salon}<br>${b.date} · ${b.time}<br>Professional: ${b.person}<br>Booking reference: ${b.id}<br>Total: ₹${b.price}<br>Status: ${b.status}`,`<div class="modal-actions"><button class="outline" onclick="closeModal()">Close</button>${b.status==='Confirmed'?`<button class="primary" onclick="closeModal();reschedule('${id}')">Manage booking</button>`:''}</div>`)}
function reschedule(id){let b=state.bookings.find(x=>x.id===id);if(!b)return;modal('Reschedule appointment','Choose a new appointment time. Changes are simulated for this investor demo.',`<div class="form-field"><label>New date</label><select id="newDate"><option>Sun, 19 Oct</option><option>Mon, 20 Oct</option><option>Tue, 21 Oct</option><option>Wed, 22 Oct</option></select></div><div class="form-field"><label>New time</label><select id="newTime"><option>10:00 AM</option><option>11:30 AM</option><option>2:00 PM</option><option>5:00 PM</option></select></div><div class="modal-actions"><button class="outline" onclick="closeModal()">Keep current</button><button class="primary" onclick="bumpBooking('${id}')">Confirm new time</button></div>`)}
function bumpBooking(id){let b=state.bookings.find(x=>x.id===id);b.date=document.getElementById('newDate').value;b.time=document.getElementById('newTime').value;closeModal();render();toast('Appointment rescheduled in demo')}
function cancelBooking(id){let b=state.bookings.find(x=>x.id===id);modal('Cancel this appointment?','Please note: demo policy allows free cancellation more than 2 hours before the appointment. No real booking will be affected.',`<div class="modal-actions"><button class="outline" onclick="closeModal()">Keep booking</button><button class="danger" onclick="confirmCancel('${id}')">Cancel appointment</button></div>`)}
function confirmCancel(id){let b=state.bookings.find(x=>x.id===id);b.status='Cancelled';closeModal();render();toast('Appointment cancelled in demo')}
function rateBooking(id){modal('How was your visit?','Share a quick rating to help the Groomly community.',`<div style="display:flex;justify-content:center;gap:12px;font-size:30px;margin:12px 0 20px" id="stars">${[1,2,3,4,5].map(i=>`<button style="border:0;background:transparent;font-size:28px" onclick="state.rating=${i};document.querySelectorAll('#stars button').forEach((b,j)=>b.style.opacity=j<${i}?1:.35)">★</button>`).join('')}</div><div class="form-field"><label>Your review</label><input id="reviewText" placeholder="What did you love?" /></div><div class="modal-actions"><button class="outline" onclick="closeModal()">Later</button><button class="primary" onclick="closeModal();toast('Thanks! Your demo review has been recorded')">Submit review</button></div>`)}
function favorites(){let fav=salons.filter(s=>state.favorites.includes(s.name));return `${pageHead('SAVED FOR LATER','Your favorites','Your shortlist of trusted places and professionals.',actionButton('Explore salons',"go('explore')",'outline'))}${fav.length?`<div class="grid salon-grid">${fav.map(salonCard).join('')}</div>`:`<div class="panel empty"><div class="empty-icon">♡</div><h3>Keep your favorites close</h3><p>Save salons you love to find them quickly next time.</p><button class="primary" onclick="go('explore')">Explore salons</button></div>`}`}

div class="profile-row"><div class="details"><strong>Privacy & security</strong><p>Manage your account settings.</p></div><button class="link-btn" onclick="modal('Privacy & security','Production version would link to privacy controls, consent history, and account deletion.')">Manage ↗</button></div><button class="outline" style="width:100%;margin-top:15px" onclick="modal('Sign out?','You are using a demo account. Signing out is simulated.', '<div class=\'modal-actions\'><button class=\'outline\' onclick=\'closeModal()\'>Stay</button><button class=\'primary\' onclick=\'closeModal();go("login")\'>Sign out</button></div>')">Sign out</button></div></div>`}

function editCategory(name=''){modal(name?'Edit category':'New service category','Categories appear in customer discovery and partner service menus.',`<div class="form-field"><label>Category name</label><input id="catName" value="${name}" placeholder="e.g. Haircut"></div><div class="form-field"><label>Display icon</label><input value="✂"></div><div class="form-field"><label>Visibility</label><select><option>Active</option><option>Review required</option><option>Hidden</option></select></div><div class="modal-actions"><button class="outline" onclick="closeModal()">Cancel</button><button class="primary" onclick="closeModal();toast('Category saved in demo')">Save category</button></div>`)}
function adminCampaigns(){return `${pageHead('GROWTH & RETENTION','Coupons & campaigns','Build thoughtful promotions that bring customers back.',actionButton('＋ Create campaign',"createCampaign()"))}<div class="grid stats">${stat('Active campaigns','8','Across 4 cities','✦')}${stat('Coupon redemptions','2,840','↑ 18% <span>this month</span>','↗')}${stat('Attributed GMV','₹4.8L','From promotions','₹')}${stat('Avg. order lift','14.2%','Compared to control','↑')}</div><div class="panel">${panelHead('Campaigns','Sample campaign data')}<div class="table-scroll"><table class="list-table"><thead><tr><th>Campaign</th><th>Code</th><th>Offer</th><th>Redemptions</th><th>Budget used</th><th>Status</th><th></th></tr></thead><tbody>${[['Welcome to Groomly','WELCOME15','15% off','1,240','₹62,000','Active'],['Weekend refresh','WEEKEND10','₹100 off','840','₹84,000','Active'],['Back in the chair','COMEBACK','20% off','520','₹52,000','Active'],['Festive styling','FESTIVE25','25% off','240','₹36,000','Scheduled']].map(x=>`<tr>${x.map((y,i)=>`<td>${i===5?`<span class="badge ${y==='Active'?'success':'pending'}">${y}</span>`:y}</td>`).join('')}<td><button class="link-btn" onclick="toast('Campaign details opened in demo')">Manage ↗</button></td></tr>`).join('')}</tbody></table></div></div>`}
function createCampaign(){modal('Create campaign','Configure an offer with clear dates and a budget cap.',`<div class="form-field"><label>Campaign name</label><input placeholder="e.g. Weekend refresh"></div><div class="form-field"><label>Coupon code</label><input placeholder="WEEKEND10"></div><div style="display:flex;gap:10px"><div class="form-field" style="flex:1"><label>Discount</label><input placeholder="10% or ₹100"></div><div class="form-field" style="flex:1"><label>Budget cap (₹)</label><input type="number" placeholder="50000"></div></div><div class="form-field"><label>Audience</label><select><option>All customers</option><option>New customers</option><option>Inactive customers</option></select></div><div class="modal-actions"><button class="outline" onclick="closeModal()">Cancel</button><button class="primary" onclick="closeModal();toast('Campaign saved as draft in demo')">Save campaign</button></div>`)}
function adminReports(){return `${pageHead('DATA & INSIGHTS','Analytics & reports','Understand marketplace growth, retention, and operational quality.',actionButton('↓ Export report',"toast('Report exported in demo')",'outline'))}<div class="grid stats">${stat('Booking conversion','8.4%','↑ 1.2 pts <span>month over month</span>','↗')}${stat('Repeat booking rate','42.8%','↑ 3.1 pts <span>month over month</span>','↻')}${stat('Avg. booking value','₹588','↑ ₹24 <span>month over month</span>','₹')}${stat('Partner utilization','72%','↑ 6 pts <span>month over month</span>','▦')}</div><div class="grid two-col"><div class="panel">${panelHead('Bookings by service','Share of completed bookings')} ${[['Haircut & styling',42],['Beard & shave',22],['Hair spa',14],['Color & treatments',12],['Skin & facial',10]].map(x=>`<div style="margin:16px 0"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px"><strong>${x[0]}</strong><span>${x[1]}%</span></div><div class="progress"><span style="width:${x[1]*2}%"></span></div></div>`).join('')}</div><div class="panel">${panelHead('Top-performing cities','Gross booking value')} ${[['Pune','₹9.8L',84],['Mumbai','₹8.4L',72],['Bengaluru','₹6.2L',54],['Delhi NCR','₹4.0L',36]].map(x=>`<div style="margin:17px 0"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px"><strong>${x[0]}</strong><span>${x[1]}</span></div><div class="progress"><span style="width:${x[2]}%"></span></div></div>`).join('')}</div></div><div class="panel" style="margin-top:18px">${panelHead('Generate a custom report','Choose the metrics and period for your stakeholders.')}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"><div class="form-field"><label>Report type</label><select><option>Marketplace performance</option><option>Revenue & commission</option><option>Partner quality</option><option>Customer retention</option></select></div><div class="form-field"><label>Period</label><select><option>Last 30 days</option><option>Last quarter</option><option>Year to date</option></select></div><div class="form-field"><label>Format</label><select><option>CSV spreadsheet</option><option>PDF summary</option></select></div></div><button class="primary" onclick="toast('Custom report generated in demo')">Generate report →</button></div>`}
function adminSupport(){return `${pageHead('CUSTOMER EXPERIENCE','Support tickets','Resolve issues quickly and keep the marketplace trustworthy.',actionButton('＋ New ticket',"modal('Create support ticket','Create a demo ticket for follow-up.')"))}<div class="grid stats">${stat('Open tickets','9','4 high priority','♡')}${stat('Avg. first response','1h 42m','Within target','◷')}${stat('Resolved this week','184','↑ 12% <span>vs last week</span>','✓')}${stat('CSAT','94.8%','↑ 1.6 pts <span>this month</span>','★')}</div><div class="panel">${panelHead('Support inbox','Prioritize unresolved customer and partner issues')}<div class="table-scroll"><table class="list-table"><thead><tr><th>Ticket</th><th>Requester</th><th>Topic</th><th>Created</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>${[['TK-1832','Priya Shah','Refund not received','18 Oct','High','Open'],['TK-1831','Studio Noir','Payout timing','18 Oct','Medium','Open'],['TK-1829','Rahul Nair','Duplicate payment','17 Oct','High','In progress'],['TK-1824','Mira Shah','Booking reschedule','17 Oct','Low','Resolved'],['TK-1818','Blade & Birch','Verification question','16 Oct','Medium','Open']].map(x=>`<tr>${x.map((y,i)=>`<td>${i===4?`<span class="badge ${y==='High'?'cancelled':y==='Medium'?'pending':'neutral'}">${y}</span>`:i===5?`<span class="badge ${y==='Resolved'?'success':y==='Open'?'pending':'neutral'}">${y}</span>`:y}</td>`).join('')}<td><button class="link-btn" onclick="manageTicket('${x[0]}','${x[1]}','${x[2]}')">Open ↗</button></td></tr>`).join('')}</tbody></table></div></div>`}
function manageTicket(id,requester,topic){modal(`${id} · ${topic}`,`Requester: ${requester}<br>Created in demo marketplace. Add an internal note and update the ticket status.`, `<div class="form-field"><label>Reply / internal note</label><input placeholder="Write a helpful response…"></div><div class="form-field"><label>Status</label><select><option>In progress</option><option>Open</option><option>Resolved</option></select></div><div class="modal-actions"><button class="outline" onclick="closeModal()">Close</button><button class="primary" onclick="closeModal();toast('Ticket updated in demo')">Save update</button></div>`)}
function adminSettings(){return `${pageHead('PLATFORM CONFIGURATION','Settings','Manage platform defaults, safety controls, and operational policies.')}<div class="grid two-col"><div class="panel">${panelHead('Marketplace settings')}<div class="form-field"><label>Default platform commission</label><input value="12%"></div><div class="form-field"><label>Default customer cancellation window</label><select><option>2 hours before appointment</option><option>4 hours before appointment</option><option>24 hours before appointment</option></select></div><div class="form-field"><label>Default currency</label><select><option>INR — Indian Rupee (₹)</option></select></div><div class="form-field"><label>Default city</label><select><option>Pune</option><option>Mumbai</option><option>Bengaluru</option></select></div><button class="primary" onclick="toast('Marketplace settings saved in demo')">Save settings</button></div><div class="panel">${panelHead('Access & security')}<div class="profile-row"><div class="avatar">♙</div><div class="details"><strong>Admin accounts</strong><p>6 administrators · role-based access</p></div><button class="link-btn" onclick="toast('Admin access management opened in demo')">Manage</button></div><div class="profile-row"><div class="avatar">⌑</div><div class="details"><strong>Audit log</strong><p>Record of sensitive admin actions</p></div><button class="link-btn" onclick="toast('Audit log opened in demo')">View</button></div><div class="profile-row"><div class="avatar">🔒</div><div class="details"><strong>Two-factor authentication</strong><p>Required for admin accounts</p></div><span class="badge success">Enabled</span></div><div class="profile-row"><div class="avatar">♧</div><div class="details"><strong>Privacy & data retention</strong><p>Manage customer consent and data policies</p></div><button class="link-btn" onclick="toast('Privacy controls opened in demo')">Manage</button></div></div></div>`}
function adminLogin(){return `${pageHead('GROOMLY ADMIN','Administrator sign in','Secure access to platform operations.')}<div class="flow-card" style="max-width:480px"><div class="flow-body"><div class="brand" style="margin-bottom:25px"><div class="brandmark">g.</div> groomly <span class="tagline">ADMIN</span></div><div class="form-field"><label>Admin email</label><input placeholder="admin@groomly.example"></div><div class="form-field"><label>Password</label><input type="password" placeholder="Enter password"></div><button class="primary" style="width:100%" onclick="toast('Admin demo session started');go('overview')">Sign in securely →</button><p class="flow-note">Demonstration interface only. No production authentication or data is connected.</p></div></div>`}
function bookingSuccess(){let b=state.latestBooking||state.bookings[0];return `${pageHead('ALL SET','Your next great look is booked.','You’re all set. We’ve kept the details right here for you.')}<div class="flow-card" style="max-width:600px"><div class="flow-body success-screen"><div class="success-icon">✓</div><div class="eyebrow">BOOKING CONFIRMED</div><h2 style="font-size:27px">It’s a date, Sam.</h2><p class="sub">Your appointment is confirmed in this demo experience.</p><div class="booking-code">${b.id}</div><div class="summary-box" style="text-align:left"><div class="sum-line"><span>Salon</span><strong>${b.salon}</strong></div><div class="sum-line"><span>Service</span><strong>${b.name}</strong></div><div class="sum-line"><span>Professional</span><strong>${b.person}</strong></div><div class="sum-line"><span>Date & time</span><strong>${b.date} · ${b.time}</strong></div><div class="sum-line total"><span>Paid / payable</span><strong>₹${b.price}</strong></div></div><div class="btn-row" style="justify-content:center">${actionButton('View appointment →',"go('bookings')")}${actionButton('＋ Add to calendar',"toast('Calendar event prepared in demo')",'outline')}</div><p class="flow-note">Demo note: this booking is stored only in this page session. Payment and notifications are simulated.</p></div></div>`}
const oldCustomerScreen=customerScreen;customerScreen=function(){if(state.screen==='bookingSuccess')return bookingSuccess();return oldCustomerScreen()};
render();
</script>
